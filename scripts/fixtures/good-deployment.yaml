# DEMO DATA -- synthetic fixture for migration-readiness-check.sh.
# A compliant Deployment: current stable API, resource limits set, no
# hostPath, no privileged containers. Expect zero findings.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web-good
  labels:
    app: demo-web-good
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-web-good
  template:
    metadata:
      labels:
        app: demo-web-good
    spec:
      containers:
        - name: web
          image: nginxdemos/hello:plain-text
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
