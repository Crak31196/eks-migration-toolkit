# DEMO DATA -- synthetic fixture for migration-readiness-check.sh.
# A privileged, host-networked DaemonSet -- the kind of node-agent pattern
# common on self-managed clusters that deserves a CKS-style security
# review (least privilege, PSA/OPA policy) before it lands on EKS.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: demo-node-agent
spec:
  selector:
    matchLabels:
      app: demo-node-agent
  template:
    metadata:
      labels:
        app: demo-node-agent
    spec:
      hostNetwork: true
      containers:
        - name: agent
          image: busybox:1.36
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
