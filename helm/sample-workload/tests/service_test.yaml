suite: service
templates:
  - service.yaml
tests:
  - it: defaults to ClusterIP on port 80
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 80

  - it: supports overriding to a LoadBalancer service type
    set:
      service.type: LoadBalancer
      service.port: 8080
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: spec.ports[0].port
          value: 8080

  - it: selects pods by the standard selector labels
    asserts:
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: sample-workload
            app.kubernetes.io/instance: RELEASE-NAME
